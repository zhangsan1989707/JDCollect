<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JD Collector - 数据管理</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="navbar">
    <div>
      <h1>JD Collector</h1>
      <span class="count">已采集 <span id="totalCount">0</span> 条职位</span>
    </div>
    <div class="navbar-actions">
      <button id="refreshBtn">🔄 刷新</button>
      <button id="syncFeishuBtn">☁️ 同步飞书</button>
      <button id="exportBtn">📥 导出CSV</button>
      <button id="clearBtn" class="btn-danger-nav">🗑️ 清空</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索职位名称、公司、地点..." />
    </div>
    <div class="filter-group">
      <label>状态</label>
      <select id="statusFilter">
        <option value="">全部</option>
        <option value="pending">待投递</option>
        <option value="applied">已投递</option>
        <option value="interview">面试中</option>
        <option value="offer">已Offer</option>
        <option value="rejected">已拒绝</option>
        <option value="withdrawn">已撤回</option>
      </select>
    </div>
    <div class="filter-group">
      <label>来源</label>
      <select id="sourceFilter">
        <option value="">全部</option>
        <option value="zhipin">BOSS直聘</option>
        <option value="liepin">猎聘</option>
        <option value="lagou">拉勾</option>
        <option value="zhaopin">智联招聘</option>
        <option value="import">导入</option>
      </select>
    </div>
    <div class="filter-group">
      <label>收藏</label>
      <select id="starFilter">
        <option value="">全部</option>
        <option value="starred">已收藏</option>
        <option value="unstarred">未收藏</option>
      </select>
    </div>
    <div class="filter-group">
      <label>标签</label>
      <select id="tagFilter">
        <option value="">全部</option>
      </select>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="list">📋 职位列表</div>
    <div class="tab" data-tab="stats">📊 数据统计</div>
    <div class="tab" data-tab="import">📥 导入数据</div>
  </div>

  <div class="batch-actions" id="batchActions">
    <span>已选中 <span id="selectedCount">0</span> 条</span>
    <button style="background:#cce5ff;color:#004085;" id="batchStatusBtn">批量改状态</button>
    <button style="background:#d4edda;color:#155724;" id="batchTagBtn">批量加标签</button>
    <button style="background:#f8d7da;color:#721c24;" id="batchDeleteBtn">批量删除</button>
  </div>

  <div class="container">
    <div class="tab-content active" id="tab-list">
      <table id="jobsTable">
        <thead>
          <tr>
            <th class="checkbox-col"><input type="checkbox" id="selectAll"></th>
            <th class="star-col">⭐</th>
            <th data-sort="title">职位名称 <span class="sort-icon"></span></th>
            <th data-sort="company">公司 <span class="sort-icon"></span></th>
            <th data-sort="salary">薪资 <span class="sort-icon"></span></th>
            <th data-sort="location">地点 <span class="sort-icon"></span></th>
            <th>经验/学历</th>
            <th data-sort="status">状态 <span class="sort-icon"></span></th>
            <th>标签</th>
            <th>来源</th>
            <th>备注</th>
            <th class="action-col">操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none;">
        <div class="icon">📭</div>
        <p>暂无数据，请前往招聘网站进行采集</p>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>

    <div class="tab-content" id="tab-stats">
      <div class="stats-grid" id="statsGrid"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div class="chart-container" id="salaryChart">
          <h3>💰 薪资分布</h3>
          <div id="salaryBars"></div>
        </div>
        <div class="chart-container" id="locationChart">
          <h3>📍 地区分布</h3>
          <div id="locationBars"></div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;">
        <div class="chart-container" id="statusChart">
          <h3>📋 投递状态分布</h3>
          <div id="statusPie" class="pie-chart"></div>
        </div>
        <div class="chart-container" id="sourceChart">
          <h3>🌐 来源分布</h3>
          <div id="sourceBars"></div>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-import">
      <div class="import-section">
        <h3>📥 导入 CSV 数据</h3>
        <p style="font-size:12px;color:#666;margin-bottom:8px;">粘贴从 JD Collector 导出的 CSV 内容，或选择 CSV 文件导入</p>
        <textarea id="csvInput" placeholder="在此粘贴 CSV 内容..."></textarea>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button class="btn-import" id="importBtn">导入数据</button>
          <label class="btn-import" style="display:inline-flex;align-items:center;cursor:pointer;">
            📁 选择文件
            <input type="file" id="csvFileInput" accept=".csv" style="display:none;" />
          </label>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
